<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="circuit-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Circuit Lines -->
      <path d="M20,20 L80,20 L80,80" fill="none" stroke="#b8c1ec" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <path d="M120,180 L120,120 L180,120" fill="none" stroke="#e0c3fc" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <path d="M180,20 L150,20 L150,80 L180,80" fill="none" stroke="#90f1ef" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <path d="M20,180 L80,180 L80,140" fill="none" stroke="#eebbc3" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      
      <!-- Nodes/Dots -->
      <circle cx="20" cy="20" r="3" fill="#b8c1ec" opacity="0.6"/>
      <circle cx="80" cy="80" r="3" fill="#b8c1ec" opacity="0.6"/>
      <circle cx="120" cy="180" r="3" fill="#e0c3fc" opacity="0.6"/>
      <circle cx="180" cy="120" r="3" fill="#e0c3fc" opacity="0.6"/>
      <circle cx="180" cy="20" r="3" fill="#90f1ef" opacity="0.6"/>
      <circle cx="180" cy="80" r="3" fill="#90f1ef" opacity="0.6"/>
      <circle cx="20" cy="180" r="3" fill="#eebbc3" opacity="0.6"/>

      <!-- Subtle Connectors -->
      <line x1="80" y1="80" x2="120" y2="120" stroke="#b8c1ec" stroke-width="1" stroke-dasharray="4 4" opacity="0.2"/>
      <line x1="80" y1="20" x2="150" y2="80" stroke="#90f1ef" stroke-width="1" stroke-dasharray="4 4" opacity="0.2"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#circuit-pattern)"/>
</svg>
